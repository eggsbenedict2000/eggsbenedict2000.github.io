<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:300px;
    max-width:80%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#0078d7;
    color:white;
    cursor:pointer;
    margin:4px;
}

button:hover{
    background:#005fb8;
}

.search-box{
    text-align:center;
}

.weather-current{
    text-align:center;
}

.location-name{
    font-size:28px;
    font-weight:bold;
}

.temp{
    font-size:64px;
    margin:15px 0;
}

.info{
    margin:8px 0;
    font-size:18px;
}

.forecast-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-top:20px;
}

.forecast-card{
    background:#f4f4f4;
    padding:15px;
    border-radius:12px;
    transition:0.3s;
}

.forecast-card:hover{
    transform:translateY(-5px);
}

iframe{
    width:100%;
    height:500px;
    border:none;
    border-radius:15px;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>Weather Dashboard</h1>

<div class="search-box">

<input
type="text"
id="city"
placeholder="Enter a city">

<button onclick="searchCity()">
Search
</button>

<button onclick="findMeByGPS()">
GPS Location
</button>

<button onclick="findMeByIP()">
IP Location
</button>

</div>

</div>

<div class="card">

<div id="weather">
Loading weather...
</div>

</div>

<div class="card">

<h2>Live Rain Radar</h2>
<br>

<iframe
id="radar"
src="https://embed.windy.com/embed2.html?lat=-37.81&lon=144.96&zoom=6&level=surface&overlay=radar&product=radar">
</iframe>

</div>

</div>

<script>

async function searchCity(){

    const city =
    document.getElementById("city")
    .value.trim();

    if(!city) return;

    try{

        const response = await fetch(
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`
        );

        const data = await response.json();

        if(!data.results){

            alert("City not found");
            return;

        }

        const location = data.results[0];

        loadWeather(
            location.latitude,
            location.longitude,
            location.name + ", " + location.country
        );

    }
    catch(error){

        console.error(error);

    }

}

function findMeByGPS(){

    if(!navigator.geolocation){

        findMeByIP();
        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            loadWeather(
                position.coords.latitude,
                position.coords.longitude,
                "My GPS Location"
            );

        },

        function(){

            findMeByIP();

        }

    );

}

async function findMeByIP(){

    try{

        const response =
        await fetch(
        "https://ipapi.co/json/"
        );

        const data =
        await response.json();

        loadWeather(
            data.latitude,
            data.longitude,
            data.city + ", " +
            data.country_name
        );

    }
    catch(error){

        console.error(error);

    }

}

async function loadWeather(
    latitude,
    longitude,
    locationName
){

    try{

        const response = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max&forecast_days=5&timezone=auto`
        );

        const data =
        await response.json();

        let forecastHTML = "";

        for(
            let i = 0;
            i < data.daily.time.length;
            i++
        ){

            forecastHTML += `
            <div class="forecast-card">

                <h3>
                ${data.daily.time[i]}
                </h3>

                <p>
                Max:
                ${data.daily.temperature_2m_max[i]}°C
                </p>

                <p>
                Min:
                ${data.daily.temperature_2m_min[i]}°C
                </p>

                <p>
                Rain:
                ${data.daily.precipitation_probability_max[i]}%
                </p>

            </div>
            `;

        }

        document.getElementById(
            "weather"
        ).innerHTML = `

        <div class="weather-current">

            <div class="location-name">
                ${locationName}
            </div>

            <div class="temp">
                ${data.current.temperature_2m}°C
            </div>

            <div class="info">
                Humidity:
                ${data.current.relative_humidity_2m}%
            </div>

            <div class="info">
                Wind:
                ${data.current.wind_speed_10m} km/h
            </div>

            <div class="info">
                Sunrise:
                ${new Date(
                    data.daily.sunrise[0]
                ).toLocaleTimeString()}
            </div>

            <div class="info">
                Sunset:
                ${new Date(
                    data.daily.sunset[0]
                ).toLocaleTimeString()}
            </div>

            <div class="info">
                Rain Chance:
                ${data.daily.precipitation_probability_max[0]}%
            </div>

            <h2 style="margin-top:25px;">
                5 Day Forecast
            </h2>

            <div class="forecast-grid">

                ${forecastHTML}

            </div>

        </div>
        `;

        document.getElementById(
            "radar"
        ).src =
        `https://embed.windy.com/embed2.html?lat=${latitude}&lon=${longitude}&zoom=7&level=surface&overlay=radar&product=radar`;

    }
    catch(error){

        console.error(error);

    }

}

findMeByGPS();

</script>

</body>
</html>
