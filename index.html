<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather & Satellite Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.search-box{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:300px;
    max-width:80%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#0078d7;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#005fb8;
}

#map{
    height:500px;
    border-radius:15px;
}

.weather-current{
    text-align:center;
}

.temp{
    font-size:60px;
    font-weight:bold;
    color:#333;
}

.forecast-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
    margin-top:20px;
}

.forecast-card{
    background:#f4f4f4;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.forecast-card h3{
    margin-bottom:10px;
}

.location-name{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.instructions{
    text-align:center;
    margin-top:10px;
    color:#555;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">
        <h1>🌤 Weather & Satellite Explorer</h1>

        <div class="search-box">
            <input
                type="text"
                id="city"
                placeholder="Enter city name"
            >
            <button onclick="searchCity()">Search</button>
        </div>

        <div class="instructions">
            Search a city or click anywhere on the satellite map.
        </div>
    </div>

    <div class="card">
        <div id="weather">
            <div class="weather-current">
                <h2>Select a location</h2>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>🛰 Satellite Map</h2>
        <div id="map"></div>
    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-37.8136, 144.9631], 5);

// Satellite imagery
L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    attribution: 'Esri World Imagery'
}
).addTo(map);

let marker = null;

// Click anywhere on map
map.on('click', function(e){

    const lat = e.latlng.lat;
    const lon = e.latlng.lng;

    if(marker){
        map.removeLayer(marker);
    }

    marker = L.marker([lat, lon]).addTo(map);

    loadWeather(lat, lon, "Selected Location");
});

async function searchCity(){

    const city = document.getElementById("city").value.trim();

    if(!city){
        return;
    }

    try{

        const response = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`
        );

        const data = await response.json();

        if(!data.results || data.results.length === 0){

            alert("City not found");
            return;

        }

        const location = data.results[0];

        map.setView(
            [location.latitude, location.longitude],
            10
        );

        if(marker){
            map.removeLayer(marker);
        }

        marker = L.marker([
            location.latitude,
            location.longitude
        ]).addTo(map);

        loadWeather(
            location.latitude,
            location.longitude,
            `${location.name}, ${location.country}`
        );

    }
    catch(error){

        console.error(error);
        alert("Error finding location");

    }
}

async function loadWeather(
    latitude,
    longitude,
    locationName
){

    try{

        const response = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=5&timezone=auto`
        );

        const data = await response.json();

        let forecastHTML = "";

        for(let i = 0; i < data.daily.time.length; i++){

            forecastHTML += `
                <div class="forecast-card">
                    <h3>${data.daily.time[i]}</h3>
                    <p>⬆️ ${data.daily.temperature_2m_max[i]}°C</p>
                    <p>⬇️ ${data.daily.temperature_2m_min[i]}°C</p>
                </div>
            `;
        }

        document.getElementById("weather").innerHTML = `
            <div class="weather-current">

                <div class="location-name">
                    ${locationName}
                </div>

                <div class="temp">
                    ${data.current.temperature_2m}°C
                </div>

                <p>
                    💧 Humidity:
                    ${data.current.relative_humidity_2m}%
                </p>

                <p>
                    🌬 Wind:
                    ${data.current.wind_speed_10m} km/h
                </p>

                <h2 style="margin-top:25px;">
                    5-Day Forecast
                </h2>

                <div class="forecast-grid">
                    ${forecastHTML}
                </div>

            </div>
        `;

    }
    catch(error){

        console.error(error);

        document.getElementById("weather").innerHTML =
            "<h2>Failed to load weather data.</h2>";

    }

}

// Auto-load Melbourne on startup
loadWeather(
    -37.8136,
    144.9631,
    "Melbourne, Australia"
);

marker = L.marker(
    [-37.8136, 144.9631]
).addTo(map);

</script>

</body>
</html>
